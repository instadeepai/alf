<svg viewBox="0 0 1080 640" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" role="img">
  <title>ALF active learning loop</title>
  <desc>A clockwise loop — Dataset, Surrogate, Optimizer, Oracle — repeated for N rounds.</desc>
  <defs>
    <linearGradient id="hub" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#46269a"/>
      <stop offset="1" stop-color="#2c1763"/>
    </linearGradient>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6.5,3 L0,6 Z" fill="#7a5fc0"/>
    </marker>
    <filter id="soft" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#351c75" flood-opacity="0.14"/>
    </filter>
  </defs>

  <!-- canvas panel -->
  <rect x="6" y="6" width="1068" height="628" rx="22" fill="#ffffff" stroke="#efe9fa" stroke-width="1"/>

  <!-- title -->
  <text x="540" y="48" text-anchor="middle" font-size="27" font-weight="700" fill="#351c75">The Active Learning Loop</text>
  <text x="540" y="73" text-anchor="middle" font-size="14.5" fill="#76728a">Each label is expensive — ALF spends them wisely</text>

  <!-- loop arrows (clockwise): Dataset -> Surrogate -> Optimizer -> Oracle -> Dataset -->
  <g fill="none" stroke="#7a5fc0" stroke-width="4" stroke-linecap="round">
    <path d="M426,332 A116,116 0 0 1 520,238" marker-end="url(#ah)"/>
    <path d="M560,238 A116,116 0 0 1 654,332" marker-end="url(#ah)"/>
    <path d="M654,372 A116,116 0 0 1 560,466" marker-end="url(#ah)"/>
    <path d="M520,466 A116,116 0 0 1 426,372" marker-end="url(#ah)"/>
  </g>

  <!-- center hub -->
  <circle cx="540" cy="352" r="94" fill="url(#hub)"/>
  <text x="540" y="348" text-anchor="middle" font-size="46" font-weight="800" fill="#ffffff" letter-spacing="2">ALF</text>
  <text x="540" y="374" text-anchor="middle" font-size="11.5" fill="#cdbff0" letter-spacing="3">ACTIVE LEARNING</text>
  <text x="540" y="400" text-anchor="middle" font-size="12.5" fill="#a98fe8" font-style="italic">repeat × N rounds</text>

  <!-- ============ DATASET (left) ============ -->
  <g filter="url(#soft)">
    <rect x="138" y="306" width="264" height="92" rx="16" fill="#ffffff" stroke="#e6e0f2" stroke-width="1.5"/>
  </g>
  <circle cx="178" cy="352" r="23" fill="#4f5fd6"/>
  <g fill="#ffffff">
    <circle cx="168" cy="342" r="2.8"/><circle cx="178" cy="342" r="2.8"/><circle cx="188" cy="342" r="2.8"/>
    <circle cx="168" cy="352" r="2.8"/><circle cx="178" cy="352" r="2.8"/><circle cx="188" cy="352" r="2.8"/>
    <circle cx="168" cy="362" r="2.8"/><circle cx="178" cy="362" r="2.8"/><circle cx="188" cy="362" r="2.8"/>
  </g>
  <text x="212" y="345" font-size="17" font-weight="700" fill="#4f5fd6">Dataset</text>
  <text x="212" y="365" font-size="11.5" fill="#5b5b6b">Add new labels back to</text>
  <text x="212" y="382" font-size="11.5" fill="#5b5b6b">your candidate pool</text>

  <!-- ============ SURROGATE (top) ============ -->
  <g filter="url(#soft)">
    <rect x="408" y="122" width="264" height="92" rx="16" fill="#ffffff" stroke="#e6e0f2" stroke-width="1.5"/>
  </g>
  <circle cx="448" cy="168" r="23" fill="#6e4ccf"/>
  <g fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="436,178 444,168 452,172 461,158"/>
  </g>
  <g fill="#ffffff">
    <circle cx="436" cy="178" r="2"/><circle cx="444" cy="168" r="2"/><circle cx="452" cy="172" r="2"/><circle cx="461" cy="158" r="2"/>
  </g>
  <text x="482" y="158" font-size="17" font-weight="700" fill="#6e4ccf">Surrogate</text>
  <text x="482" y="178" font-size="11.5" fill="#5b5b6b">Train a cheap model on</text>
  <text x="482" y="195" font-size="11.5" fill="#5b5b6b">what you've measured</text>

  <!-- ============ OPTIMIZER (right) ============ -->
  <g filter="url(#soft)">
    <rect x="678" y="306" width="264" height="92" rx="16" fill="#ffffff" stroke="#e6e0f2" stroke-width="1.5"/>
  </g>
  <circle cx="718" cy="352" r="23" fill="#8c3cc4"/>
  <g fill="none" stroke="#ffffff" stroke-width="2.2">
    <circle cx="718" cy="352" r="12"/>
    <circle cx="718" cy="352" r="5.5"/>
  </g>
  <circle cx="718" cy="352" r="2.2" fill="#ffffff"/>
  <text x="752" y="345" font-size="17" font-weight="700" fill="#8c3cc4">Optimizer</text>
  <text x="752" y="365" font-size="11.5" fill="#5b5b6b">Acquisition + search pick</text>
  <text x="752" y="382" font-size="11.5" fill="#5b5b6b">the next batch to test</text>

  <!-- ============ ORACLE (bottom) ============ -->
  <g filter="url(#soft)">
    <rect x="408" y="490" width="264" height="92" rx="16" fill="#ffffff" stroke="#e6e0f2" stroke-width="1.5"/>
  </g>
  <circle cx="448" cy="536" r="23" fill="#aa2fb0"/>
  <g fill="none" stroke="#ffffff" stroke-width="2" stroke-linejoin="round" stroke-linecap="round">
    <path d="M443,525 L443,533 L436,547 a4.5,4.5 0 0 0 4,7 l10,0 a4.5,4.5 0 0 0 4,-7 L453,533 L453,525"/>
    <line x1="440" y1="525" x2="456" y2="525"/>
  </g>
  <text x="482" y="526" font-size="17" font-weight="700" fill="#aa2fb0">Oracle</text>
  <text x="482" y="546" font-size="11.5" fill="#5b5b6b">Score the batch: assay,</text>
  <text x="482" y="563" font-size="11.5" fill="#5b5b6b">simulation, or measurement</text>
</svg>