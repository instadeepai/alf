[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "alf"
version = "0.1.0"
description = "A Python package for handling multi-modal data candidates"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "numpy>=1.21.0",
    "torch>=1.9.0",
    "networkx>=2.6.0",
    "pandas>=1.3.0",
    "scipy>=1.9.0",
    "matplotlib>=3.3.0",
    "neptune>=1.0.0",
    "hydra-core>=1.3.0",
    "omegaconf>=2.3.0",
    "s3fs>=2023.6.0",
    "requests>=2.25.0",
    "ipykernel>=6.25.0",
    "huggingface_hub==0.27.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=6.2.0",
    "pytest-cov>=2.12.0",
    "black>=21.0.0",
    "flake8>=3.9.0",
    "mypy>=0.910",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_paths = ["."]
