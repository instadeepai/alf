[project]
name = "alf"
version = "0.1.0"
description = "Active Learning Framework (ALF) - A comprehensive framework for active learning experiments"
readme = "README.md"
requires-python = ">=3.12,<3.14.1"
dependencies = [
    "alf_core",
    "alf_tools",
    "alf_tutorials",
]

# Path sources for local packages
[tool.uv.sources]
alf_core = { path = "core", editable = true }
alf_tools = { path = "tools", editable = true }
alf_tutorials = { path = "tutorials", editable = true }
torch = { index = "pytorch-cpu" }  # Default: CPU version for broader compatibility

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-gpu"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

# Pyright/Pylance configuration for type checking and imports
# This is needed because the project uses editable installs (development mode)
# where packages are linked from source directories rather than installed in site-packages.
# Pyright doesn't automatically follow these dynamic import hooks, so we explicitly
# tell it where to find the alf_core, alf_tools, and alf_tutorials packages.
[tool.pyright]
venvPath = "."  # Virtual environment is in the root directory
venv = ".venv"  # Name of the virtual environment folder
pythonVersion = "3.12"  # Match the Python version used in the project
# extraPaths: Additional directories to search for imports beyond site-packages
extraPaths = ["core/alf_core", "tools/alf_tools", "tutorials"]
# include: Directories that should be analyzed for type checking
include = ["core", "tools", "tutorials"]

# Execution environment configuration for the entire workspace
[[tool.pyright.executionEnvironments]]
root = "."
extraPaths = ["core", "tools", "tutorials"]

[dependency-groups]
dev = [
    "pytest>=6.2.0",
    "pytest-cov>=2.12.0",
    "black>=21.0.0",
    "flake8>=3.9.0",
    "mypy>=0.910",
    "pre-commit>=4.1.0",
]

[tool.uv]
default-groups = ["dev"]

[tool.mypy]
# Python version to target
python_version = "3.12"
# Namespace packages allow packages without __init__.py
namespace_packages = true
# Explicit package bases to help mypy find imports
mypy_path = "core:tools:tutorials"
# Show error codes in output for easier debugging
show_error_codes = true
# Warn about unused ignores
warn_unused_ignores = true
# Use explicit package bases to avoid module name conflicts
explicit_package_bases = true
# Disable name-defined errors globally for jaxtyping annotations
# jaxtyping uses string literals like "n_samples" in type annotations
# which mypy interprets as undefined names
# Also disable no-untyped-def to allow functions without complete type annotations
disable_error_code = ["name-defined", "import-untyped", "no-untyped-def"]
# Ignore missing imports for all third-party libraries by default
# This prevents errors when libraries don't have type stubs
ignore_missing_imports = false
# Disallow untyped definitions (can be enabled later for stricter typing)
# disallow_untyped_defs = true
# Disallow any expressions
# disallow_any_expr = true  # Uncomment for strictest typing

# Relax type checking for test files
[[tool.mypy.overrides]]
module = [
    "*.tests.*",
    "tests.*",
]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"
