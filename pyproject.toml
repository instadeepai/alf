[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "alf"
version = "0.1.0"
description = "A Python package for performing active learning experiments."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.21.0",
    "torch>=1.9.0",
    "networkx>=2.6.0",
    "pandas>=1.3.0",
    "scipy>=1.9.0",
    "matplotlib>=3.3.0",
    "neptune>=1.0.0",
    "hydra-core>=1.3.0",
    "omegaconf>=2.3.0",
    "s3fs>=2023.6.0",
    "requests>=2.25.0",
    "ipykernel>=6.25.0",
]

[dependency-groups]
dev = [
    "pytest>=6.2.0",
    "pytest-cov>=2.12.0",
    "black>=21.0.0",
    "flake8>=3.9.0",
    "mypy>=0.910",
    "pre-commit>=4.1.0",
]

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu"},
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv]
default-groups = [
  "dev",
]