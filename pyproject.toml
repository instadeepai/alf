[project]
name = "alf"
version = "0.1.0"
description = "Active Learning Framework (ALF) - A comprehensive framework for active learning experiments"
readme = "README.md"
requires-python = ">=3.12,<3.14.1"
dependencies = [
    "alf_core",
    "alf_tools",
    "alf_tutorials",
]

# Path sources for local packages
[tool.uv.sources]
alf_core = { path = "core", editable = true }
alf_tools = { path = "tools", editable = true }
alf_tutorials = { path = "tutorials", editable = true }

# Pyright/Pylance configuration for type checking and imports
# This is needed because the project uses editable installs (development mode)
# where packages are linked from source directories rather than installed in site-packages.
# Pyright doesn't automatically follow these dynamic import hooks, so we explicitly
# tell it where to find the alf_core, alf_tools, and alf_tutorials packages.
[tool.pyright]
venvPath = "."  # Virtual environment is in the root directory
venv = ".venv"  # Name of the virtual environment folder
pythonVersion = "3.12"  # Match the Python version used in the project
# extraPaths: Additional directories to search for imports beyond site-packages
extraPaths = ["core/alf_core", "tools/alf_tools", "tutorials"]
# include: Directories that should be analyzed for type checking
include = ["core", "tools", "tutorials"]

# Execution environment configuration for the entire workspace
[[tool.pyright.executionEnvironments]]
root = "."
extraPaths = ["core", "tools", "tutorials"]

[dependency-groups]
dev = [
    "pytest>=6.2.0",
    "pytest-cov>=2.12.0",
    "black>=21.0.0",
    "flake8>=3.9.0",
    "mypy>=0.910",
    "pre-commit>=4.1.0",
]

docs = [
    "sphinx>=7.0.0",
    "furo>=2023.0.0",
    "myst-parser>=2.0.0",
    "sphinx-autodoc-typehints>=1.24.0",
    "sphinx-design>=0.5.0",
]
guacamol = ["alf_tools[guacamol]"]

tutorials = [
    "matplotlib>=3.7.0",
    "umap-learn>=0.5.0",
]

transformers = ["alf_tools[transformers]"]
esm2 = ["alf_tools[esm2]"]
esmfold = ["alf_tools[esmfold]"]
chemprop = ["alf_tools[chemprop]"]
mlip = ["alf_tools[mlip]"]

# Workflow umbrellas (mirror the alf_tools extras of the same name).
protein = ["alf_tools[protein]"]
molecule = ["alf_tools[molecule]"]

# Dependencies for the benchmark_examples/ taster scripts: plotting + ESM2 (transformers).
benchmark = [
    "matplotlib>=3.7.0",
    "alf_tools[esm2]",
]

[tool.uv]
default-groups = ["dev"]

[tool.setuptools]
packages = []  # No Python packages at root level - just a meta-package

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
# Disable name-defined errors for jaxtyping dimension names
disable_error_code = ["name-defined"]
# Use explicit package bases to avoid duplicate conftest.py module errors
explicit_package_bases = true
