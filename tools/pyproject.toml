[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "alf_tools"
version = "0.1.0b0"
description = "A Python package with tools for performing active learning experiments."
readme = "README.md"
requires-python = ">=3.12,<3.14.1"
license = {text = "Apache-2.0"}
authors = [{name = "InstaDeep Ltd"}]
keywords = ["active learning", "bayesian optimization", "machine learning", "scientific discovery", "pytorch"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "alf_core",
    "requests>=2.25.0",
    "huggingface_hub>=0.27.0,<2.0",
    "pyarrow>=22.0.0",
    "jaxtyping>=0.3.5",
    "torch>=2.10.0",
    "gpytorch>=1.9.0,<2.0",
    "scipy>=1.9.0",
    "botorch>=0.17.0,<1.0",
]

[project.urls]
Homepage = "https://instadeepai.github.io/alf/"
Repository = "https://github.com/instadeepai/alf"
Documentation = "https://instadeepai.github.io/alf/"
"Bug Tracker" = "https://github.com/instadeepai/alf/issues"

[project.optional-dependencies]
# Shared base extra — single source of truth for the transformers pin, reused
# by every model that needs it (esm2, esmfold).
transformers = ["transformers>=4.36.0"]

# Per-model extras
# Capped below 2.3: that release requires cuik_molmaker, whose X11 libs slim images lack.
chemprop = [
    "chemprop>=2.0.0,<2.3.0",
]
esm2 = ["alf_tools[transformers]"]
esmfold = [
    "alf_tools[transformers]",
    "accelerate>=0.26.0",
]
guacamol = ["rdkit>=2022.9.0"]
mlip = ["mlip>=0.2.0"]
mlip-cuda13 = ["mlip[cuda13]>=0.2.0"]
matbench = ["matbench>=0.6", "pymatgen>=2023.0"]

# Workflow umbrellas — install everything for an expected workflow at once.
protein = ["alf_tools[esm2,esmfold]"]
molecule = ["alf_tools[chemprop,guacamol,mlip]"]
materials = ["alf_tools[matbench]"]

[tool.setuptools.packages.find]
where = ["."]
include = ["alf_tools*"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-gpu"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
alf_core = { path = "../core", editable = true }
torch = [
  { index = "pytorch-cpu" },
]

# matbench (PyPI 0.6) hard-pins matminer==0.7.4, scipy==1.7.3, monty==2022.4.26,
# and scikit-learn==1.0.1, none of which build on Python 3.12 (they pull an old
# numpy that needs the removed `distutils`). Override with modern, compatible
# versions — matbench itself only uses stable, long-unchanged parts of their APIs.
[tool.uv]
override-dependencies = [
    "matminer>=0.9",
    "scipy>=1.11",
    "monty>=2024.1.1",
    "scikit-learn>=1.3",
]

[tool.pytest.ini_options]
markers = [
    "integration: marks tests as integration tests requiring the real model (deselect with '-m not integration')",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
