[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "alf_tools"
version = "0.1.0"
description = "A Python package with tools for performing active learning experiments."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alf_core",
    "requests>=2.25.0",
    "huggingface_hub==0.27.0",
    "jaxtyping>=0.3.5",
    "torch>=2.10.0",
    "gpytorch>=1.9.0",
    "scipy>=1.9.0",
    "botorch>=0.17.0",
]

[project.optional-dependencies]
chemprop = [
    "chemprop>=2.0.0,<3.0.0",
]
esm2 = [
    "transformers>=4.36.0",
]
esmfold = [
    "transformers>=4.36.0",
    "accelerate>=0.26.0",
]
guacamol = ["rdkit>=2022.9.0"]

# Entry points expose alf-tools/alf-core components to alf-benchmark's registry by name.
# Providers reference plain classes only; no import of alf_benchmark is required here.
[project.entry-points."alf.models"]
cnn = "alf_tools.models.cnn:CNNModel"
gp = "alf_tools.models.gp:GPModel"
mlp = "alf_tools.models.mlp:MLPModel"
esm2 = "alf_tools.models.esm2:ESM2Model"
chemprop = "alf_tools.models.chemprop:ChempropModel"
esmfold = "alf_tools.models.esmfold:ESMFoldModel"

[project.entry-points."alf.datasets"]
gfp = "alf_tools.datasets.gfp:GFP"
flip = "alf_tools.datasets.flip:FLIP"
proteingym = "alf_tools.datasets.proteingym:ProteinGym"
guacamol = "alf_tools.datasets.guacamol.guacamol_dataset:GuacaMol"

[project.entry-points."alf.acquisition_functions"]
greedy = "alf_tools.optimizer.acquisition_functions.greedy:Greedy"
ucb = "alf_tools.optimizer.acquisition_functions.ucb:UCB"
ei = "alf_tools.optimizer.acquisition_functions.expected_improvement:ExpectedImprovement"
thompson = "alf_tools.optimizer.acquisition_functions.thompson_sampling:ThompsonSampling"
coreset = "alf_tools.optimizer.acquisition_functions.core_set:CoreSet"

[project.entry-points."alf.searches"]
dataset_search = "alf_core.optimizer.search:DatasetSearch"
single_mutant = "alf_tools.optimizer.search.single_mutant_search:SingleMutantSearch"

[tool.setuptools.packages.find]
where = ["."]
include = ["alf_tools*"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-gpu"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
alf_core = { path = "../core", editable = true }
torch = [
  { index = "pytorch-cpu" },
]

[tool.pytest.ini_options]
markers = [
    "integration: marks tests as integration tests requiring the real model (deselect with '-m not integration')",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
