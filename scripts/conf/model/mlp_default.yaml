# @package _global_
model:
  class_name: mlp
  name: mlp_default
  hidden_dims: [256, 128]
  activation: relu
  norm: none
  dropout: 0.0
  n_mc_passes: 0
  model_seed: 0
  train:
    learning_rate: 0.001
    batch_size: 32
    num_epochs: 50
    optimizer: adam
    weight_decay: 0.0
    log_frequency: 10
