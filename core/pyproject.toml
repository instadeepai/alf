[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "alf_core"
version = "0.1.0a0"
description = "A Python package for performing active learning experiments."
readme = "README.md"
requires-python = ">=3.12,<3.14.1"
license = {text = "Apache-2.0"}
authors = [{name = "InstaDeep Ltd"}]
keywords = ["active learning", "bayesian optimization", "machine learning", "scientific discovery"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "beartype>=0.18.0",
    "jaxtyping>=0.3.5",
    "numpy>=1.21.0",
    "pandas>=1.3.0",
    "pydantic",
    "scipy>=1.9.0",
    "scikit-learn>=1.0.0",
]

[project.urls]
Homepage = "https://instadeepai.github.io/alf/"
Repository = "https://github.com/instadeepai/alf"
Documentation = "https://instadeepai.github.io/alf/"
"Bug Tracker" = "https://github.com/instadeepai/alf/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["alf_core*"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
