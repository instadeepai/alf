[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "alf_core"
version = "0.1.0"
description = "A Python package for performing active learning experiments."
readme = "README.md"
requires-python = ">=3.12,<3.14.1"
dependencies = [
    "numpy>=1.21.0",
    "pandas>=1.3.0",
    "pydantic",
    "scipy>=1.9.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["alf_core*"]

[dependency-groups]
dev = [
    "pytest>=6.2.0",
    "pytest-cov>=2.12.0",
    "black>=21.0.0",
    "flake8>=3.9.0",
    "mypy>=0.910",
    "pre-commit>=4.1.0",
    "torch>=1.9.0",  # For testing torch tensor compatibility
]

[tool.uv]
default-groups = [
  "dev",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
