name: Release 🚀

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:latest

    steps:
      - name: Git setup
        run: |
          apt-get update && apt-get install -y \
          coreutils \
          git
          git config --system --add safe.directory $GITHUB_WORKSPACE

      - name: Checkout code  📦
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Verify versions match
        run: |
          ROOT=$(grep '^version = ' pyproject.toml | awk -F'"' '{print $2}')
          CORE=$(grep '^version = ' core/pyproject.toml | awk -F'"' '{print $2}')
          TOOLS=$(grep '^version = ' tools/pyproject.toml | awk -F'"' '{print $2}')
          echo "root=$ROOT core=$CORE tools=$TOOLS"
          if [ "$ROOT" != "$CORE" ] || [ "$ROOT" != "$TOOLS" ]; then
            echo "Version mismatch: root=$ROOT core=$CORE tools=$TOOLS"
            exit 1
          fi

      - name: Build and publish
        run: |
          cd core
          uv build
          uv publish --token ${{secrets.CORE_PYPI_TOKEN}}

          cd ../tools
          uv build
          uv publish --token ${{secrets.TOOLS_PYPI_TOKEN}}
          cd ..

      - name: Create tag
        run: |
          cd core
          TAG="v$(uv version | awk '{print $2}')"
          git tag $TAG
          git push origin $TAG
