name: Tests and Linters 🧪

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  linters:
    runs-on: ubuntu-latest
    container:
      image: python:3.12-slim-bullseye

    steps:
      - name: Git setup
        run: |
          apt-get update && apt-get install -y \
          coreutils \
          git
          git config --system --add safe.directory $GITHUB_WORKSPACE

      - name: Checkout code  📦
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Lint
        run: |
          uv sync
          uv run --no-sync pre-commit run --all-files --verbose

  tests:
      runs-on: ubuntu-latest
      env:
        HF_TOKEN: ${{ secrets.HF_TOKEN }}
      container:
        image: python:3.12-slim-bullseye

      steps:
        - name: Git setup
          run: |
            apt-get update && apt-get install -y \
            coreutils \
            git

        - name: Checkout code  📦
          uses: actions/checkout@v4
          with:
            fetch-depth: '0'

        - name: Add safe directory 🔒
          run: git config --system --add safe.directory $GITHUB_WORKSPACE

        - name: Install uv
          uses: astral-sh/setup-uv@v6

        - name: Sync dependencies
          # --all-groups installs every dependency-group in the root pyproject,
          # including docs/tutorials and the optional extras re-exposed as groups
          # (guacamol, esm2, esmfold, chemprop). A new extra is picked up here
          # automatically once it is re-exposed as a group in the root pyproject
          # (`foo = ["alf_tools[foo]"]`); no workflow edit needed. See issue #120.
          run: uv sync --all-groups

        - name: Run tests (core) 🧪
          run: |
            uv run --no-sync pytest core --verbose --cov-report xml:core/coverage-core.xml \
                            --cov-report term-missing \
                            --junitxml=core/pytest-core.xml \
                            --cov=alf_core

        - name: Run tests (tools) 🧪
          run: |
            uv run --no-sync pytest tools --verbose --cov-report xml:tools/coverage-tools.xml \
                            --cov-report term-missing \
                            --junitxml=tools/pytest-tools.xml \
                            --cov=alf_tools

        - name: Pytest coverage comment (core) 💬
          id: coverageCommentCore
          uses: MishaKav/pytest-coverage-comment@287292879eaaff04116f36d3eb1a670f6e5df1a4
          with:
            title: Core Coverage Report
            unique-id-for-comment: coverage-core
            pytest-xml-coverage-path: core/coverage-core.xml
            junitxml-path: core/pytest-core.xml

        - name: Pytest coverage comment (tools) 💬
          id: coverageCommentTools
          uses: MishaKav/pytest-coverage-comment@287292879eaaff04116f36d3eb1a670f6e5df1a4
          with:
            title: Tools Coverage Report
            unique-id-for-comment: coverage-tools
            pytest-xml-coverage-path: tools/coverage-tools.xml
            junitxml-path: tools/pytest-tools.xml

        - name: Update core coverage badge 🏷️
          if: github.ref == 'refs/heads/main'
          uses: schneegans/dynamic-badges-action@e9a478b16159b4d31420099ba146cdc50f134483
          with:
            auth: ${{ secrets.GIST_SECRET }}
            gistID: 114eb5680493468e40f5a528c08f1888
            filename: alf-core-coverage.json
            label: core coverage
            message: ${{ steps.coverageCommentCore.outputs.coverage }}
            color: ${{ steps.coverageCommentCore.outputs.color }}
            namedLogo: python

        - name: Update tools coverage badge 🏷️
          if: github.ref == 'refs/heads/main'
          uses: schneegans/dynamic-badges-action@e9a478b16159b4d31420099ba146cdc50f134483
          with:
            auth: ${{ secrets.GIST_SECRET }}
            gistID: 25ce4b64d5b9cda177203366146f5bf0
            filename: alf-tools-coverage.json
            label: tools coverage
            message: ${{ steps.coverageCommentTools.outputs.coverage }}
            color: ${{ steps.coverageCommentTools.outputs.color }}
            namedLogo: python
