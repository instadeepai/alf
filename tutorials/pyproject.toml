[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "alf_tutorials"
version = "0.1.0"
description = "Tutorials for the ALF active learning framework."
requires-python = ">=3.12"
dependencies = [
    "alf_core",
    "alf_tools[esm2]",
    "matplotlib>=3.3.0",
    "umap-learn>=0.5.0",
    "ipykernel>=6.25.0",
    "pyrosetta-installer",
]

[tool.setuptools]
packages = []  # No Python packages, just notebooks

[tool.uv.sources]
alf_core = {path = "../core", editable = true}
alf_tools = {path = "../tools", editable = true}

[dependency-groups]
dev = [
    "jupyter>=1.1.1",
    "nbconvert>=7.17.1",
]
