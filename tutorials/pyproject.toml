[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "alf_tutorials"
version = "0.1.0"
description = "Tutorials for the ALF active learning framework."
requires-python = ">=3.12"
dependencies = [
    "alf_core",
    "alf_tools",
    "matplotlib>=3.3.0",
    "umap-learn>=0.5.0",
    "llvmlite>=0.39.0",
    "ipykernel>=6.25.0",
    "pyrosetta-installer",
    "seaborn>=0.12.0",
]

[project.optional-dependencies]
# ESM-2 tutorial needs transformers, exposed via alf_tools' esm2 extra.
# Install with: uv sync --extra esm2
esm2 = ["alf_tools[esm2]"]

[tool.setuptools]
packages = []  # No Python packages, just notebooks

[tool.uv.sources]
alf_core = {path = "../core", editable = true}
alf_tools = {path = "../tools", editable = true}

[dependency-groups]
dev = [
    "jupyter>=1.1.1",
    "nbconvert>=7.17.1",
]

# Optional extras for individual tutorials, mirroring the alf_tools extras so the
# `uv sync --group <name>` commands in the tutorials also work from `tutorials/`.
# MLIP tutorial needs the mlip package (MACE force field). Install with: uv sync --group mlip
mlip = ["alf_tools[mlip]"]
