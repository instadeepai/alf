[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "alf_tutorials"
version = "0.1.0"
description = "Tutorials for the ALF active learning framework."
requires-python = ">=3.12"
dependencies = [
    "alf_core",
    "alf_tools",
    "matplotlib>=3.3.0",
    "ipykernel>=6.25.0",
    "pyrosetta-installer",
]

[tool.setuptools]
packages = []  # No Python packages, just notebooks

[dependency-groups]
dev = [
    "pytest>=6.2.0",
    "pytest-cov>=2.12.0",
    "black>=21.0.0",
    "flake8>=3.9.0",
    "mypy>=0.910",
    "pre-commit>=4.1.0",
]

[tool.uv.sources]
alf_core = {path = "../core", editable = true}
alf_tools = {path = "../tools", editable = true}

[tool.uv]
default-groups = [
  "dev",
]
